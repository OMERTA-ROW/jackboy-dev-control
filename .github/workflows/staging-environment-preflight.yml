name: Staging environment preflight (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Inspect staging target without writes
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DB_CA_CERT: ${{ secrets.STAGING_DB_CA_CERT }}
        run: node scripts/staging-environment-preflight.mjs
