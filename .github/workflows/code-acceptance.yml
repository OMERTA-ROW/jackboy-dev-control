name: CODE acceptance (isolated, mocked providers)
# Runs the CODE safety suites and the OMNI encrypted-loopback interoperability test on a hosted runner.
# No secrets, no environments, read-only token. Tests run in an empty network namespace, so any attempt
# to reach OpenAI or another paid provider fails instead of spending money. It never dispatches CODE.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: code-acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  # Public companion repository, pinned so the interop result is reproducible.
  OMNI_REPOSITORY: OMERTA-ROW/Omni
  OMNI_REF: a129adf2379514d0802e9ac8d8faba3784429129
  MOTHERSHIP_REPOSITORY: OMERTA-ROW/orbiting-minds-mothership
  MOTHERSHIP_REF: ee2964f907753bad74c250dc73aeaa45422b0819
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OMNI_REPOSITORY }}
          ref: ${{ env.OMNI_REF }}
          path: omni
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOTHERSHIP_REPOSITORY }}
          ref: ${{ env.MOTHERSHIP_REF }}
          path: mothership
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Prepare disposable PostgreSQL
        run: |
          set -euo pipefail
          test -x "$(pg_config --bindir)/initdb"
          npm install --prefix "$RUNNER_TEMP/acceptance-pg-driver" pg@8.16.3 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/acceptance-pg" "$RUNNER_TEMP/acceptance"
      - name: Record environment
        run: |
          date -u +%FT%TZ
          git rev-parse HEAD
          git -C omni rev-parse HEAD
          git -C mothership rev-parse HEAD
          node --version && go version && bun --version
      - name: Prove the sandbox has no outbound network
        run: |
          if sudo unshare -n curl -sS -m 5 -o /dev/null https://api.openai.com/v1/models; then
            echo "Outbound paid-provider access is reachable; refusing to continue." >&2
            exit 1
          fi
          echo "Outbound access blocked as required."
      - name: CODE safety and OMNI interoperability suites (no network)
        env:
          OMNI_INBOX_DIR: ${{ github.workspace }}/omni/inbox
          MOTHERSHIP_TEST_ROOT: ${{ github.workspace }}/mothership
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          export PG_BIN="$(pg_config --bindir)"
          export PGROOT="$RUNNER_TEMP/acceptance-pg"
          export STAGING_PG_MODULE_FROM="$RUNNER_TEMP/acceptance-pg-driver/package.json"
          export STAGING_PG_URL=postgres://postgres@127.0.0.1:54329/postgres
          sudo --preserve-env=PATH,PG_BIN,PGROOT,STAGING_PG_MODULE_FROM,STAGING_PG_URL,OMNI_INBOX_DIR,MOTHERSHIP_TEST_ROOT,GOTOOLCHAIN,GOFLAGS \
            unshare -n bash -euo pipefail -c '
              ip link set lo up
              if curl --noproxy "*" -sS -m 3 https://api.openai.com/v1/models; then
                echo "Provider egress reachable; refusing tests." >&2
                exit 1
              fi
              runuser -u runner -- "$PG_BIN/initdb" -D "$PGROOT/data" -U postgres --auth=trust
              trap '\''runuser -u runner -- "$PG_BIN/pg_ctl" -D "$PGROOT/data" -m fast stop'\'' EXIT
              runuser -u runner -- "$PG_BIN/pg_ctl" -D "$PGROOT/data" -l "$PGROOT/postgres.log" \
                -o "-h 127.0.0.1 -p 54329 -k $PGROOT" -w start
              runuser -u runner -- timeout 300 node --test --test-concurrency=1 \
                --test-timeout=60000 --test-reporter=spec tests/code-*.test.mjs tests/omni-*.test.mjs
            ' 2>&1 | tee "$RUNNER_TEMP/acceptance/node-tests.txt"
      - name: OMNI Go suites (no network)
        working-directory: omni/inbox
        env:
          GOTOOLCHAIN: local
        run: |
          sudo -E env "PATH=$PATH" unshare -n sh -c 'ip link set lo up && runuser -u runner -- timeout 300 go test ./... -count=1 -timeout 120s' 2>&1 | tee "$RUNNER_TEMP/acceptance/go-tests.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Assert nothing was skipped
        run: |
          if grep -E '^ℹ skipped [1-9]' "$RUNNER_TEMP/acceptance/node-tests.txt"; then
            echo "A required acceptance test was skipped." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-acceptance-results
          path: ${{ runner.temp }}/acceptance
          retention-days: 7
