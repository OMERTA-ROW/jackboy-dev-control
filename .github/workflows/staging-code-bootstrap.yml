name: Staging CODE schema bootstrap
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed main commit approved for this staging write
        required: true
      staging_confirmation:
        description: Enter verified-staging-only after independent target and credential verification
        required: true
permissions:
  contents: read
concurrency:
  group: staging-code-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed staging bootstrap
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DB_CA_CERT: ${{ secrets.STAGING_DB_CA_CERT }}
        run: node scripts/staging-code-bootstrap.mjs
