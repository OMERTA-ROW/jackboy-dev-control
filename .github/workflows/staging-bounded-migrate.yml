name: Bounded Jackboy staging migrations through 0064
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed main commit separately approved for this staging write
        required: true
      staging_confirmation:
        description: Enter railway-jackboy-staging after separate target, backup and TLS verification
        required: true
permissions:
  contents: read
concurrency:
  group: staging-code-bootstrap
  cancel-in-progress: false
jobs:
  migrate:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Check exact approved main and workflow commit before accessing DB secrets
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
          RUNNER_ENVIRONMENT: staging
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const e = process.env;
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (e.GITHUB_ACTIONS !== 'true' || e.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              e.GITHUB_REPOSITORY !== 'OMERTA-ROW/jackboy-dev-control' ||
              e.GITHUB_REF !== 'refs/heads/main' || e.GITHUB_RUN_ATTEMPT !== '1' ||
              !/^[0-9a-f]{40}$/.test(e.GITHUB_SHA ?? '') ||
              e.GITHUB_WORKFLOW_REF !== 'OMERTA-ROW/jackboy-dev-control/.github/workflows/staging-bounded-migrate.yml@refs/heads/main' ||
              e.GITHUB_WORKFLOW_SHA !== e.GITHUB_SHA ||
              e.APPROVED_COMMIT !== e.GITHUB_SHA || head !== e.GITHUB_SHA ||
              e.STAGING_CONFIRMATION !== 'railway-jackboy-staging') {
            console.error('preflight: approval_input');
            process.exit(1);
          }
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run only the separately approved staging migration range
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
          RUNNER_ENVIRONMENT: staging
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DB_CA_CERT: ${{ secrets.STAGING_DB_CA_CERT }}
        run: node scripts/staging-bounded-migrate.mjs
