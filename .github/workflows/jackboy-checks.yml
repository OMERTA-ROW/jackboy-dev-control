name: Jackboy checks
on:
  pull_request:
  push:
    branches: ["jackboy/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bunx vitest run
      - run: bunx tsc --noEmit -p . || true
